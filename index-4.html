<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>👑 PATNA CLUB 👑</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0d0d0d;color:#fff;font-family:Arial,sans-serif;text-align:center}
header{padding:18px 12px 14px;background:#171717;border-bottom:2px solid #292929}
.profile{width:90px;height:90px;border-radius:50%;object-fit:cover;border:4px solid #ffd400;display:block;margin:0 auto 10px}
h1{margin:0;color:#ffd400;font-size:30px}
.sub{margin:7px 0 0;color:#ddd}
.coins{padding:18px;background:#222;font-size:23px;font-weight:bold;color:#ffd400}
.start{margin:18px auto;padding:15px 35px;border:0;border-radius:12px;background:#18b83b;color:#fff;font-size:21px;font-weight:bold;cursor:pointer}
#games{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:16px;max-width:700px;margin:auto}
.card{background:#222;border:1px solid #333;border-radius:14px;padding:14px}
.icon{font-size:38px}
.card h3{font-size:18px;margin:8px 0}
.question{font-size:22px;font-weight:bold;margin:12px 0}
.play{background:#ffd400;color:#111;border:0;border-radius:9px;padding:10px 18px;font-weight:bold;font-size:16px}
#gameBox{display:none;background:#222;max-width:600px;margin:18px auto;padding:22px;border-radius:16px}
#gameQuestion{font-size:28px;font-weight:bold;margin:15px}
#answer{width:90%;max-width:300px;padding:13px;border-radius:9px;border:1px solid #aaa;text-align:center;font-size:20px}
.msg{min-height:28px;margin:12px;font-weight:bold}
footer{padding:25px 10px;background:#111;color:#aaa}
.founder{color:#ffd400;font-size:22px;font-weight:bold}
.small{font-size:14px}
</style>
</head>
